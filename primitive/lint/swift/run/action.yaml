name: Check Swift formatting
description: Run swift format lint on Swift sources and annotate every finding; the repository's .swift-format decides the style

inputs:
  paths:
    description: Newline-separated paths or globs of files or directories to check, relative to the working directory
    required: false
    default: "."

runs:
  using: composite
  steps:
    # swift-format ships with Xcode 16 and later; each file is checked against the nearest .swift-format above it.
    - name: Lint
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        targets=()
        while IFS= read -r pattern; do
          [[ -n "${pattern// }" ]] || continue
          for path in $pattern; do
            targets+=("$path")
          done
        done <<< "$PATHS"
        (( ${#targets[@]} > 0 )) || { echo "::error::No path matches the paths input."; exit 1; }
        status=0
        swift format lint --strict --recursive --parallel "${targets[@]}" 2> findings.txt || status=$?
        # Findings read "file:line:column: warning: [Rule] message"; each becomes an annotation on the change.
        sed -E 's/^([^:]+):([0-9]+):([0-9]+): (warning|error): (.*)$/::error file=\1,line=\2,col=\3::\5/' findings.txt
        rm -f findings.txt
        exit "$status"
