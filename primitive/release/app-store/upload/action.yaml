name: Upload to App Store Connect
description: Archive an Xcode scheme for one platform and upload it to App Store Connect, signed through an App Store Connect API key

inputs:
  project:
    description: Path of the .xcodeproj to archive; leave empty when workspace is set
    required: false
    default: ""
  workspace:
    description: Path of the .xcworkspace to archive; leave empty when project is set
    required: false
    default: ""
  scheme:
    description: Scheme to archive
    required: true
  platform:
    description: Platform to archive for, as xcodebuild names it in generic/platform=, for example iOS, macOS or tvOS
    required: true
  version:
    description: Version people see (CFBundleShortVersionString), for example 1.2.0
    required: true
  build-number:
    description: Build number (CFBundleVersion); it must grow with every upload of the same version
    required: true
  team-id:
    description: Team that signs the build; empty uses the project's DEVELOPMENT_TEAM
    required: false
    default: ""
  api-key-id:
    description: Key ID of the App Store Connect API key
    required: true
  api-issuer-id:
    description: Issuer ID of the App Store Connect API key
    required: true
  api-key:
    description: Contents of the App Store Connect API key's .p8 file; pass it from a secret
    required: true

outputs:
  archive-path:
    description: Path of the archive that was uploaded
    value: ${{ steps.upload.outputs.archive-path }}

runs:
  using: composite
  steps:
    # The API key lets Xcode create profiles and sign with a cloud-managed distribution certificate,
    # so the runner needs no distribution certificate in its keychain. The key lives only for this step.
    - name: Archive and upload
      id: upload
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
        WORKSPACE: ${{ inputs.workspace }}
        SCHEME: ${{ inputs.scheme }}
        PLATFORM: ${{ inputs.platform }}
        VERSION: ${{ inputs.version }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        TEAM_ID: ${{ inputs.team-id }}
        API_KEY_ID: ${{ inputs.api-key-id }}
        API_ISSUER_ID: ${{ inputs.api-issuer-id }}
        API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        [[ -n "$PROJECT" || -n "$WORKSPACE" ]] || { echo "::error::Set project or workspace."; exit 1; }
        [[ -z "$PROJECT" || -z "$WORKSPACE" ]] || { echo "::error::Set project or workspace, not both."; exit 1; }
        [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::version must look like 1, 1.2 or 1.2.3, not '$VERSION'."; exit 1; }
        [[ "$BUILD_NUMBER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::build-number must be a number, not '$BUILD_NUMBER'."; exit 1; }

        work="$RUNNER_TEMP/app-store-upload-${PLATFORM// /-}"
        rm -rf "$work" && mkdir -p "$work"
        key="$work/AuthKey_$API_KEY_ID.p8"
        trap 'rm -f "$key"' EXIT
        (umask 077 && printf '%s\n' "$API_KEY" > "$key")

        source=(-project "$PROJECT")
        [[ -z "$WORKSPACE" ]] || source=(-workspace "$WORKSPACE")
        authentication=(
          -allowProvisioningUpdates
          -authenticationKeyPath "$key"
          -authenticationKeyID "$API_KEY_ID"
          -authenticationKeyIssuerID "$API_ISSUER_ID"
        )
        team=()
        [[ -z "$TEAM_ID" ]] || team=(DEVELOPMENT_TEAM="$TEAM_ID")

        archive="$work/$SCHEME.xcarchive"
        echo "::group::Archive $SCHEME $VERSION ($BUILD_NUMBER) for $PLATFORM"
        xcodebuild archive \
          "${source[@]}" \
          -scheme "$SCHEME" \
          -configuration Release \
          -destination "generic/platform=$PLATFORM" \
          -archivePath "$archive" \
          -derivedDataPath "$work/DerivedData" \
          -skipMacroValidation \
          -skipPackagePluginValidation \
          "${authentication[@]}" \
          MARKETING_VERSION="$VERSION" \
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
          ${team[@]+"${team[@]}"}
        echo "::endgroup::"

        options="$work/ExportOptions.plist"
        /usr/libexec/PlistBuddy \
          -c "Add :method string app-store-connect" \
          -c "Add :destination string upload" \
          -c "Add :signingStyle string automatic" \
          -c "Add :manageAppVersionAndBuildNumber bool false" \
          -c "Add :uploadSymbols bool true" \
          "$options" > /dev/null
        [[ -z "$TEAM_ID" ]] || /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$options"

        echo "::group::Upload $SCHEME $VERSION ($BUILD_NUMBER) for $PLATFORM"
        xcodebuild -exportArchive \
          -archivePath "$archive" \
          -exportOptionsPlist "$options" \
          -exportPath "$work/Export" \
          "${authentication[@]}"
        echo "::endgroup::"

        echo "archive-path=$archive" >> "$GITHUB_OUTPUT"
        echo "Uploaded $SCHEME $VERSION ($BUILD_NUMBER) for $PLATFORM; App Store Connect processes it before TestFlight offers it." >> "$GITHUB_STEP_SUMMARY"
